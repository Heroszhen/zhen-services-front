<section #container>
  @if (videoUrl !== null) {
    @switch (videoType) {
      @case (VideoTypeEnum.INTEGRATION) {
        <div id="wrap-integration" [innerHTML]="videoUrl | safe: 'html'"></div>
      }

      @case (VideoTypeEnum.MP4) {
        <video controls [src]="videoUrl"></video>
      }

      @case (VideoTypeEnum.DOUYIN) {
        <div id="wrap-douyin" class="text-center">
          <iframe
            [src]="videoUrl | safe: 'resourceUrl'"
            referrerPolicy="unsafe-url"
            allowFullScreen
            title=""
            id="iframe-open-douyin"
            class="w-[325px] h-[721px]"></iframe>
        </div>
      }

      @case (VideoTypeEnum.TIKTOK) {
        <div id="wrap-tiktok" class="text-center">
          <iframe
            [src]="videoUrl | safe: 'resourceUrl'"
            referrerPolicy="unsafe-url"
            allowFullScreen
            title=""
            id="iframe-open-tiktok"
            width="{{videoWidth}}" 
            height="{{videoHeight}}"
            class="rounded-[20px]"></iframe>
        </div>
      }

      @case (VideoTypeEnum.YOUTUBE_SHORT) {
        <div id="wrap-youtube-short" class="text-center">
          <iframe 
           [src]="videoUrl | safe: 'resourceUrl'" 
           width="{{videoWidth}}" 
           height="{{videoHeight}}"
           allowFullScreen
          ></iframe>
        </div>
      }

      @case (VideoTypeEnum.INSTAGRAM) {
        <div id="wrap-instagram" [innerHTML]="videoUrl | safe: 'html'"></div>
      }
    }
  }
</section>
